const GT={core:"\u{1F396}\uFE0F CORE FORCES",mp:"\u{1FA96} MANPADS / INFANTRY",aa:"\u{1F699} SELF-PROPELLED AA",ss:"\u{1F69B} SAM \u00B7 SHORT RANGE",sm:"\u{1F69B} SAM \u00B7 MEDIUM RANGE",sl:"\u{1F69B} SAM \u00B7 LONG RANGE",rd:"\u{1F4E1} RADAR VEHICLES",su:"\u{1F69A} SUPPORT VEHICLES",pd:"\u{1F6E1}\uFE0F POINT DEFENSE",st:"\u{1F3D9}\uFE0F STATIC AIR DEFENSE"};
pal.innerHTML='<button data-k="" class="on"><b>&#9654;</b>Select</button>'+Object.keys(GT).map(g=>`<details${g==="core"?" open":""}><summary>${GT[g]}</summary>`+Object.entries(TY).filter(([k,d])=>(d.cat||"core")===g).map(([k,d])=>`<button data-k="${k}"><b>${d.k}</b>${d.n}</button>`).join("")+"</details>").join("");
/* AA / SAM fire control */
function aaFire2(u,t){const d=TY[u.type],D=Math.hypot(t.x-u.x,t.y-u.y),a=Math.atan2(t.y-u.y,t.x-u.x),g=d.gr>0&&u.ammo>0&&D<=d.gr,s=d.sam>0&&u.sam>0&&u.cd3<=0&&D<=d.sr&&D>80;
if(!g&&!s){u.cd=.35;return}
const sm=s&&(!g||D>d.gr*.75);let m;
if(sm){u.sam--;if(!d.gr)u.ammo=Math.max(0,u.ammo-1);u.cd3=d.scd;u.cd=.6;m=d.ms||(d.ms={n:"SAM",dm:d.sd,sp:0,sr:0,v:d.sv,col:"#ffffff",w:2,acc:.92,sf:1,hd:1,l:30,trail:1})}
else{u.ammo--;if(u.bq>0){u.bq--;u.cd=u.bq>0?d.gc:1.2}else{u.bq=d.bs;u.cd=d.gc}m=d.mg||(d.mg={n:d.n+" gun",dm:d.gd,sp:0,sr:0,v:1100,col:"#ffe890",w:1.3,acc:.85,sf:1,hd:1,l:14})}
u.lm=m.n;st[u.team].shots++;
if(!(T<=u.fct)){u.fcv=units.some(o=>o.team===u.team&&o.hp>0&&TY[o.type].fc&&Math.hypot(o.x-u.x,o.y-u.y)<900)?1.15:1;u.fct=T+2}
const R=Math.max(d.gr,d.sr),acc=Math.min(.97,Math.max(.3,.95-D/R*.5)*m.acc*u.fcv*(u.opt>T?.6:1)*(u.m?u.m.acc:1)),hit=Math.random()<acc,sc2=hit?0:25+D*.05,ex=t.x+(Math.random()-.5)*sc2*2,ey=t.y+(Math.random()-.5)*sc2*2;
proj.push({x:u.x,y:u.y,x0:u.x,y0:u.y,tx:ex,ty:ey,t:0,T:Math.max(.06,D/m.v),m,src:u,tg:t,hit});
u.rc=T;booms.push({x:u.x+Math.cos(a)*12,y:u.y+Math.sin(a)*12,r:sm?16:8,life:.18,max:.18});if(sm)smokes.push(mkSmoke(u.x+Math.cos(a)*10,u.y+Math.sin(a)*10,10,3))}
function ciwsStep(dt){for(const u of units){const d=TY[u.type];if(!d.ciws||u.hp<=0||u.ammo<4)continue;for(const s of shells){if(s.done||s.t<0||s.src.team===u.team)continue;if(Math.hypot(s.x-u.x,s.y-u.y)<d.gr&&Math.random()<dt*1.1){s.done=1;u.ammo-=3;tracers.push({x1:u.x,y1:u.y,x2:s.x,y2:s.y,life:.15,team:u.team,w:1.2});booms.push({x:s.x,y:s.y,r:12,life:.3,max:.3});break}}}shells=shells.filter(s=>!s.done)}
/* sprites for the new roster */
function genSprite(u,d,c){const S=d.sp,kick=T-(u.rc||-9)<.1?2:0,bl=(x,y,w,h,f)=>{ctx.fillStyle=f;ctx.fillRect(x,y,w,h)},trk=()=>{bl(-9,-7,18,3,"#15181a");bl(-9,4,18,3,"#15181a")},whl=()=>{for(const x of[-7,-1,6]){bl(x,-7,3,2.5,"#15181a");bl(x,4.5,3,2.5,"#15181a")}};
const tubes=(n,len,col)=>{const w=Math.min(n,6),h=10/w;for(let i=0;i<w;i++)bl(-4,-5+i*h+.4,len,Math.max(1.2,h-.8),col)},barrels=(n,len)=>{const w=Math.min(n,4);for(let i=0;i<w;i++)bl(3,(i-(w-1)/2)*2.6-.6,len-kick,1.2,"#1a1d1f")};
if(S==="inf"){bl(1,-1,d.tl,2,"#c9c9a0");ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,0,2.8,4,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle="rgba(0,0,0,.45)";ctx.beginPath();ctx.arc(0,0,1.8,0,7);ctx.fill();if(d.rdr){ctx.strokeStyle="#cfd";ctx.beginPath();ctx.arc(-4,0,3,0,7);ctx.stroke()}}
else if(S==="gun"||S==="sam"){S==="gun"?trk():whl();bl(-9,-4.5,18,9,c);ctx.strokeRect(-9,-4.5,18,9);ctx.rotate(u.tur-u.ang);bl(-4,-4,8,8,c);ctx.strokeRect(-4,-4,8,8);if(S==="gun"){barrels(d.nb,13);if(d.sam){bl(-3,-6,5,1.6,"#d8d8d0");bl(-3,4.4,5,1.6,"#d8d8d0")}}else tubes(d.nt,12,"#e8e8e0")}
else if(S==="rdr"||S==="sup"){whl();bl(-10,-4.5,20,9,c);ctx.strokeRect(-10,-4.5,20,9);bl(5,-3.5,4,7,"rgba(180,220,255,.7)");
if(S==="rdr"){ctx.save();ctx.translate(-3,0);if(d.rt==="dish"){ctx.rotate(T*1.5+u.id);bl(-1,-7,2,14,"#d8e2dc")}else if(d.rt==="panel")bl(-1.5,-6,3,12,"#e8f0ec");else{ctx.fillStyle="#d8e2dc";ctx.beginPath();ctx.arc(0,0,2.5,0,7);ctx.fill();bl(-.5,-7,1,14,"#d8e2dc")}ctx.restore()}
else{ctx.save();ctx.rotate(-u.ang);ctx.fillStyle="#fff";ctx.font="bold 9px monospace";ctx.textAlign="center";ctx.fillText(d.sy||"+",-3,3);ctx.restore()}}
else if(S==="pd"){ctx.fillStyle="#2a2e2a";ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();ctx.stroke();ctx.rotate(u.tur-u.ang);bl(-4,-4,8,8,c);ctx.strokeRect(-4,-4,8,8);if(d.ciws){ctx.fillStyle="#e8eef0";ctx.beginPath();ctx.arc(-1,0,4.5,0,7);ctx.fill();ctx.stroke()}barrels(d.nb,d.ciws?10:13)}
else{ctx.rotate(-u.ang);const sh=d.sh;bl(-11,-11,22,22,"#2a2e2a");ctx.strokeRect(-11,-11,22,22);
if(sh==="pad"){ctx.rotate(u.tur);bl(-5,-5,10,10,c);ctx.strokeRect(-5,-5,10,10);if(d.nt)tubes(d.nt,10,"#e8e8e0");else barrels(d.nb,12)}
else if(sh==="rdr"||sh==="twr"){ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.stroke();ctx.rotate(T*1.5+u.id);bl(-1,-9,2,18,d.rdr?"#e8f0ec":"#ffd24a")}
else if(sh==="arch"){ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,3,9,Math.PI,0);ctx.lineTo(9,10);ctx.lineTo(-9,10);ctx.closePath();ctx.fill();ctx.stroke();bl(-4,3,8,7,"#000a")}
else{bl(-8,-8,16,16,c);ctx.strokeRect(-8,-8,16,16);bl(-5,-5,10,10,"#000a");ctx.fillStyle="#fff";ctx.font="bold 9px monospace";ctx.textAlign="center";ctx.fillText(d.sy||"",0,3)}}}
/* ===== CAPTURE POINTS (5 points, first to 1000 wins) ===== */
const CPR=150,WIN=1000,WI=120,CP0=[[.2,.5],[.5,.15],[.5,.5],[.5,.85],[.8,.5]];let cps=[],sc=[0,0];
function cpReset(){cps=CP0.map((p,i)=>({id:"ABCDE"[i],x:p[0]*W,y:p[1]*H,v:i===0?100:i===4?-100:0,o:i===0?0:i===4?1:-1,n:[0,0]}));sc=[0,0]}
function cpGoal(u){const d=TY[u.type];if(d.fl||d.spd<=0||!cps.length)return null;if(u.cpT>T)return u.cpG;
let b=null,bc=1e18,pool=cps.filter(p=>!(p.o===u.team&&!p.n[1-u.team]));if(!pool.length)pool=cps;
for(const p of pool){const i=cps.indexOf(p),c=Math.hypot(p.x-u.x,p.y-u.y)*(.75+((u.id*37+i*53)%11)*.06)+(p.n[u.team]>9?500:0);if(c<bc){bc=c;b=p}}
u.cpT=T+3;return u.cpG=[b.x+((u.id*53)%100-50)*1.1,b.y+((u.id*29)%100-50)*1.1,8]}
function endGame(w){ended=true;running=false;const b=$("banner");b.style.display="flex";b.innerHTML=TN[w]+" VICTORY<small>"+(sc[0]|0)+" \u2013 "+(sc[1]|0)+" points \u00B7 "+fmt(T)+" \u00B7 BLUE lost "+st[0].lost+" \u00B7 RED lost "+st[1].lost+(mvp?" \u00B7 MVP "+mvp.n+" ("+mvp.k+" kills)":"")+"</small>";b.style.color=TC[w];setStat(TN[w]+" VICTORY");$("play").textContent="Battle over"}
function cpStep(dt){if(ended)return;for(const p of cps){p.n=[0,0];for(const u of units){if(u.hp<=0||u.ko||u.gone||u.chute>0||u.evac||u.mode==="retreat"||u.mode==="repair")continue;const d=TY[u.type];if(d.fl||d.lg)continue;if(Math.hypot(u.x-p.x,u.y-p.y)<CPR)p.n[u.team]++}
const b=p.n[0],r=p.n[1];if(b&&!r)p.v=Math.min(100,p.v+Math.min(b,6)*2.5*dt);else if(r&&!b)p.v=Math.max(-100,p.v-Math.min(r,6)*2.5*dt);
if(p.v>=100&&p.o!==0){p.o=0;evt("BLUE captured point "+p.id,0)}else if(p.v<=-100&&p.o!==1){p.o=1;evt("RED captured point "+p.id,1)}
else if((p.o===0&&p.v<=0)||(p.o===1&&p.v>=0)){evt(TN[p.o]+" lost point "+p.id);p.o=-1}
if(p.o>=0)sc[p.o]=Math.min(WIN,sc[p.o]+dt)}
if(sc[0]>=WIN||sc[1]>=WIN)endGame(sc[0]>=sc[1]?0:1)}
function drawCP(){const k=Math.max(1,.9/z),lw=Math.min(1,z*1.5);for(const p of cps){const col=p.o<0?"#cfd8d2":TC[p.o];ctx.save();ctx.translate(p.x,p.y);
ctx.globalAlpha=.12;ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,CPR,0,7);ctx.fill();ctx.globalAlpha=.7;ctx.strokeStyle=col;ctx.lineWidth=2/lw;ctx.setLineDash([12/lw,8/lw]);ctx.stroke();ctx.setLineDash([]);
if(p.v){ctx.strokeStyle=p.v>0?TC[0]:TC[1];ctx.lineWidth=5/lw;ctx.beginPath();ctx.arc(0,0,CPR-8,-Math.PI/2,-Math.PI/2+Math.abs(p.v)/100*Math.PI*2);ctx.stroke()}
ctx.globalAlpha=.95;ctx.fillStyle=p.o<0?"#2a332e":col;ctx.strokeStyle="#000";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,16*k,0,7);ctx.fill();ctx.stroke();
ctx.fillStyle="#fff";ctx.font="bold "+16*k+"px monospace";ctx.textAlign="center";ctx.fillText(p.id,0,5.5*k);
if(p.n&&p.n[0]&&p.n[1]){ctx.fillStyle="#ffb020";ctx.font="bold "+11*k+"px monospace";ctx.fillText("CONTESTED",0,-24*k)}ctx.textAlign="left";ctx.restore()}}
