else{const k=place||null,d=k&&TY[k];h=d?`<h3>TEMPLATE</h3><div style="font-weight:700">${d.n}</div>`+row2("Health",d.hp)+row2("Range",d.range)+row2("Speed",d.spd)+row2("Damage",d.dmg)+row2("Ammo",d.ammo)+row2("Detection",d.det):`<h3>UNIT INFO</h3><div style="color:var(--dm)">Select a unit on the map, or choose a unit type to deploy.</div>`}
$("info").innerHTML=h}
function panCam(rd){const pv=700/z*rd;if(keys.a||keys.arrowleft)vx-=pv;if(keys.d||keys.arrowright)vx+=pv;if(keys.w||keys.arrowup)vy-=pv;if(keys.s||keys.arrowdown)vy+=pv;if(follow&&sel&&sel.hp>0){vx=sel.x-cw/z/2;vy=sel.y-ch/z/2}clampView()}
let last=performance.now(),ul=0;
function frame(n){const rd=Math.min(.1,(n-last)/1000);last=n;panCam(rd);
if(running){const sim=rd*speed,k=Math.ceil(sim/.05);for(let i=0;i<k;i++)step(sim/k)}
draw();if(n-ul>250){ul=n;ui();drawTL()}requestAnimationFrame(frame)}
scenario();resize();z=fitZ;clampView();requestAnimationFrame(frame);
</script></body></html>
